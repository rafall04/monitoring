<!DOCTYPE html>
<html lang="id">
<head>
<title>Advertisement - PT Shou Fong Lastindo</title>
<meta http-equiv="refresh" content="2; url=$(link-orig)">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0099bb" />
<meta name="color-scheme" content="light" />
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1f2937;
    background: linear-gradient(135deg, #0099bb 0%, #6610f2 100%);
    background-attachment: fixed;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    padding: 26px 24px 20px;
    text-align: center;
  }
  .big { font-size: 17px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #4b5563; line-height: 1.6; }
  .sub a { color: #007a96; font-weight: 600; }
  .sub a:focus-visible { outline: 2px solid #0099bb; outline-offset: 2px; }
</style>
<script language="JavaScript">
<!--
    var popup = '';
    function openOrig() {
	if (window.focus) popup.focus();
	location.href = unescape('$(link-orig-esc)');
    }
    function openAd() {
	location.href = unescape('$(link-redirect-esc)');
    }
    function openAdvert() {
	if (window.name != 'hotspot_advert') {
		popup = open('$(link-redirect)', 'hotspot_advert', '');
		setTimeout("openOrig()", 1000);
		return;
	}
	setTimeout("openAd()", 1000);
    }
//-->
</script>
</head>
<body onLoad="openAdvert()">
  <main class="card">
    <div class="big">Advertisement</div>
    <div class="sub">
      Jika tidak terjadi apa-apa, buka
      <a href="$(link-redirect)" target="hotspot_advert">advertisement</a>
      secara manual.
    </div>
  </main>
</body>
</html>
