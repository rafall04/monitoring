<!DOCTYPE html>
<html lang="id">
<head>
<title id="title">Error</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" /><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1f2937;
    background: linear-gradient(135deg, #0099bb 0%, #6610f2 100%);
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    padding: 26px 24px 22px;
    text-align: center;
  }
  h3 { font-size: 15px; font-weight: 600; color: #6b7280; }
  .err {
    margin: 10px 0 16px;
    padding: 10px 14px;
    font-size: 14px;
    color: #fff;
    background: #f86c6b;
    border-radius: 12px;
    word-break: break-word;
  }
  a.btn {
    display: block;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .5px;
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #0099bb, #6610f2);
  }
  .help { margin-top: 14px; font-size: 12px; color: #6b7280; line-height: 1.6; }
  .help b { color: #374151; }
  .foot { margin-top: 14px; font-size: 11px; color: #b6bcc4; }
  .foot b { color: #8a909a; }
</style>
</head>
<body>
  <div class="card">
    <h3>Terjadi Kesalahan</h3>
    <div class="err">$(error)</div>
    <a class="btn" href="$(link-login)">KEMBALI KE LOGIN</a>
    <div class="help">Sampaikan pesan error di atas ke <b>IT Support &mdash; Aldi</b> agar cepat ditangani.</div>
    <div class="foot">&copy; Copyright 2026 | <b>RAF</b> - All rights reserved</div>
  </div>
<script type="text/javascript">
  try { document.getElementById('title').innerHTML = window.location.hostname + ' &gt; error'; } catch (e) {}
</script>
</body>
</html>
